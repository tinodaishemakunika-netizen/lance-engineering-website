backend:
  name: github
  repo: tinodaishemakunika-netizen/lance-engineering-website
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:

  - name: pages
    label: Pages
    files:
      - label: Home Page
        name: home
        file: content/home.md
        fields:
          - {label: Company Name, name: company_name, widget: string}
          - {label: Hero Heading, name: hero_heading, widget: string}
          - {label: Hero Text, name: hero_text, widget: text}
          - {label: Hero Image, name: hero_image, widget: image}

  - name: services
    label: Services
    folder: content/services
    create: true
    slug: "{{slug}}"
    fields:
      - {label: Service Name, name: title, widget: string}
      - {label: Description, name: description, widget: text}
      - {label: Service Image, name: image, widget: image}

  - name: projects
    label: Projects
    folder: content/projects
    create: true
    slug: "{{slug}}"
    fields:
      - {label: Project Name, name: title, widget: string}
      - {label: Client, name: client, widget: string}
      - {label: Description, name: description, widget: text}
      - {label: Project Image, name: image, widget: image}
