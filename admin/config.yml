backend:
  name: github
  repo: tinodaishemakunika-netizen/lance-engineering-website
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: pages
    label: Pages
    files:
      - label: Home Page
        name: home
        file: content/home.md
        fields:
          - label: Page Title
            name: title
            widget: string

          - label: Hero Heading
            name: hero_heading
            widget: string

          - label: Hero Text
            name: hero_text
            widget: text
